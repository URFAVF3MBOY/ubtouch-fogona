# uMTP-Responder (umtp-responder package) for Ubuntu Touch on fogona
loop_on_disconnect 1
show_hidden_files 0
default_uid 32011
default_gid 32011
storage "/home/phablet" "Internal Storage" "rw"
manufacturer "motorola"
product "moto g play - 2024"
serial "fogona"
firmware_version "Ubuntu Touch"
interface "MTP"
usb_vendor_id  0x1209
usb_product_id 0x0002
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008
usb_functionfs_mode 0x1
usb_dev_path   "/dev/usb-ffs/mtp/ep0"
usb_epin_path  "/dev/usb-ffs/mtp/ep1"
usb_epout_path "/dev/usb-ffs/mtp/ep2"
usb_epint_path "/dev/usb-ffs/mtp/ep3"
usb_max_packet_size 0x200
